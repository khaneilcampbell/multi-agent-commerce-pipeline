name: Tests

on:
  workflow_dispatch:
  pull_request:
  # Docs-only pushes to main don't need the test suite. Pull requests always
  # run it, so a required check never waits on a skipped run.
  push:
    branches:
      - main
      - master
    paths-ignore: ['**.md', 'docs/**']

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name != 'workflow_dispatch'
    name: Tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt

      - name: Compile
        run: python -m compileall -q scripts tests

      - name: Lint (pyflakes rules)
        run: ruff check --select F scripts tests

      - name: Shell syntax
        run: for f in run.sh loop.sh setup_vps.sh test_infrastructure.sh; do bash -n "$f"; done

      - name: Run tests
        run: pytest -q

  quality-report:
    name: Manual draft quality report
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/quality-state.json
          key: product-quality-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: product-quality-${{ github.ref_name }}-
      - name: Review local staged drafts only
        id: report
        env:
          COMMERCE_QUALITY_STOP: ${{ vars.COMMERCE_QUALITY_STOP || 'false' }}
        run: python3 scripts/product_quality_report.py --output "$RUNNER_TEMP/quality-report" --state "$RUNNER_TEMP/quality-state.json"
      - name: Publish summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/quality-report/report.md" ]; then
            cat "$RUNNER_TEMP/quality-report/report.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: commerce-draft-quality
          path: ${{ runner.temp }}/quality-report/
          retention-days: 14
          if-no-files-found: error
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: success() && steps.report.outputs.changed == 'true'
        with:
          path: ${{ runner.temp }}/quality-state.json
          key: product-quality-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
